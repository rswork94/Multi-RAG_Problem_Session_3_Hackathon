questions:
  # ---------------------------------------------------------------- keyword
  - id: grc_k1
    category: keyword
    question: "Under Paragraph 44D of the KYC (Amendment) Directions, 2026, within how many days must a regulated entity update its beneficial ownership records after becoming aware of a change in the ownership or control of a customer?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "Paragraph 44D requires beneficial ownership records to be updated within 34 days of the regulated entity becoming aware of a change in ownership or control; non-compliance is a lapse under Enforcement Head E-07."
        anchors: ["within 34 days of becoming aware"]
        evidence: "grc_rbi_kyc_amend_2026:c7"
    gold_entities: ["Paragraph 44D", "KYC Amendment Directions 2026", "Beneficial owner"]
    must_include: ["34"]
    must_not: []
  - id: grc_k2
    category: keyword
    question: "Under SEBI circular SEBI/HO/CFD/CFD-PoD-2/P/CIR/2026/087, what fine per day of delay does the stock exchange levy when a listed entity fails to submit its BRSR Core reasonable assurance report on time?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "The stock exchange levies a fine of ₹8,500 per day of delay until submission; a repeat default within 12 months doubles the daily fine, and a default beyond 90 days leads to freezing of promoter shareholding and referral to SEBI."
        anchors: ["₹8,500 per day"]
        evidence: "grc_sebi_brsr_core_2026:c6"
    gold_entities: ["SEBI Circular 2026/087", "BRSR assurance delay fine", "BRSR Core"]
    must_include: ["8,500"]
    must_not: []
  - id: grc_k3
    category: keyword
    question: "Under Meridian Small Finance Bank's Enterprise Risk Management Policy, what gross operational loss amount triggers reporting to the Risk Management Committee of the Board, and within how many working days must it be reported?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "Any operational loss event with a gross loss of ₹37,50,000 or more must be reported by the Chief Risk Officer to the RMCB within 3 working days of identification, with a root-cause analysis."
        anchors: ["₹37,50,000"]
        evidence: "grc_msfb_erm_policy_2026:c4"
    gold_entities: ["Meridian ERM Policy v4.2", "Risk Management Committee of the Board", "Operational loss escalation threshold"]
    must_include: ["37,50,000"]
    must_not: []
  - id: grc_k4
    category: keyword
    question: "Under Internal Audit SOP IA-SOP-KYC-2026/03, what minimum sample size must the audit team use when testing a control that operates daily?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "A control that operates daily must be tested with a minimum sample of 40 occurrences, extended by an equal number of items if one exception is found."
        anchors: ["minimum sample of 40 occurrences"]
        evidence: "grc_msfb_ia_sop_2026:c3"
    gold_entities: ["IA-SOP-KYC-2026/03"]
    must_include: ["40"]
    must_not: []

  # ---------------------------------------------------------------- multihop
  - id: grc_m1
    category: multihop
    question: "What monetary penalty can the Reserve Bank of India impose for each breach of the regulatory requirement that Meridian Small Finance Bank's control C-KYC-07 is designed to monitor?"
    hops: 3
    bridge_entities: ["Paragraph 38B", "High-risk category", "Enforcement Head E-11"]
    gold_facts:
      - fact: "Control C-KYC-07 (Re-KYC Due-Date Sentinel) is mapped to Paragraph 38B of the KYC Direction."
        anchors: ["Re-KYC Due-Date Sentinel"]
        evidence: "grc_msfb_control_matrix_2026:row2"
      - fact: "Paragraph 38B requires periodic updation of high risk customers at least once in every 18 months, and non-compliance is a lapse under Enforcement Head E-11."
        anchors: ["once in every 18 months"]
        evidence: "grc_rbi_kyc_amend_2026:c3"
      - fact: "Enforcement Head E-11 carries a penalty of ₹2,40,000 per account, plus ₹4,500 per day if the lapse continues beyond 60 days from the supervisory letter."
        anchors: ["₹2,40,000", "₹4,500"]
        evidence: "grc_rbi_enf_circ_2026:c5"
    gold_entities: ["C-KYC-07", "Paragraph 38B", "High-risk category", "Enforcement Head E-11", "Enforcement Circular 2026", "Meridian Small Finance Bank", "Reserve Bank of India"]
    must_include: ["2,40,000"]
    must_not: ["65,000", "no penalty applies"]
  - id: grc_m2
    category: multihop
    question: "Meridian Small Finance Bank grades a customer CRG-4. For updations falling due after July 1, 2026, how often must that customer's KYC be periodically updated, and what interval did this replace?"
    hops: 2
    bridge_entities: ["High-risk category", "Paragraph 38B"]
    gold_facts:
      - fact: "Under the Bank's ERM Policy, CRG-4 and CRG-5 are treated as high risk for all purposes of the KYC Direction."
        anchors: ["treated as high risk", "₹18,60,000"]
        evidence: "grc_msfb_erm_policy_2026:c5"
      - fact: "From July 1, 2026, Paragraph 38B requires high risk customers to be updated at least once in every 18 months, substituting the earlier requirement of at least once in every two years."
        anchors: ["once in every 18 months"]
        evidence: "grc_rbi_kyc_amend_2026:c3"
    gold_entities: ["CRG-4", "High-risk category", "Paragraph 38B", "18-month periodicity", "Two-year periodicity", "Meridian Small Finance Bank", "KYC Amendment Directions 2026"]
    must_include: ["18 months"]
    must_not: []
  - id: grc_m3
    category: multihop
    question: "A listed company ranked 410th by market capitalisation as on March 31, 2027 is covered by SEBI circular SEBI/HO/CFD/CFD-PoD-2/P/CIR/2026/087. From which financial year must it obtain reasonable assurance on its BRSR Core, and what eligibility criteria must its assurance provider meet?"
    hops: 2
    bridge_entities: ["Cohort-2 entities", "Category S2 assurance provider"]
    gold_facts:
      - fact: "Listed entities ranked 251 to 500 by market capitalisation (Cohort-2) must obtain reasonable assurance on BRSR Core from FY 2027-28, with the cohort fixed by market capitalisation as on March 31 of the preceding year."
        anchors: ["ranked 251 to 500"]
        evidence: "grc_sebi_brsr_core_2026:c2"
      - fact: "A Cohort-2 entity must appoint a Category S2 (or S1) provider: valid peer review certificate or accreditation, at least three BRSR Core assurance engagements in the preceding two years, enrolment in Register Part B, a greenhouse gas specialist from an ISO 14065 accredited body, and an engagement partner with at least five years' experience."
        anchors: ["Register Part B", "ISO 14065"]
        evidence: "grc_sebi_assurer_2026:c3"
    gold_entities: ["SEBI Circular 2026/087", "SEBI Circular 2026/112", "Cohort-2 entities", "Category S2 assurance provider", "BRSR Core", "Reasonable assurance"]
    must_include: ["2027-28", "Part B"]
    must_not: []
  - id: grc_m4
    category: multihop
    question: "Which control in Meridian Small Finance Bank's control matrix is meant to prevent the kind of lapse for which the RBI enforcement circular can bar a bank from onboarding new high risk customers for up to 180 days, and who owns that control?"
    hops: 3
    bridge_entities: ["Enforcement Head E-16", "Paragraph 41A", "Politically exposed person"]
    gold_facts:
      - fact: "Enforcement Head E-16 covers relationships with politically exposed persons established without designated senior management approval; it carries ₹7,85,000 per relationship and, where lapses exceed five relationships, a bar on onboarding new high risk customers for up to 180 days."
        anchors: ["₹7,85,000"]
        evidence: "grc_rbi_enf_circ_2026:c7"
      - fact: "Paragraph 41A requires approval by a functionary not below the rank of General Manager before activating a politically exposed person relationship, and non-compliance is a lapse under Enforcement Head E-16."
        anchors: ["not below the rank of General Manager"]
        evidence: "grc_rbi_kyc_amend_2026:c6"
      - fact: "Control C-EDD-03 (Activation Hold Gate, GM-level sign-off) is mapped to Paragraph 41A and owned by the Head – Financial Crime Compliance, operating per occurrence."
        anchors: ["Activation Hold Gate"]
        evidence: "grc_msfb_control_matrix_2026:row5"
    gold_entities: ["Enforcement Head E-16", "Paragraph 41A", "Politically exposed person", "C-EDD-03", "Enforcement Circular 2026", "Meridian Small Finance Bank"]
    must_include: ["C-EDD-03", "Financial Crime Compliance"]
    must_not: []

  # ---------------------------------------------------------------- vocab_alias
  - id: grc_a1
    category: vocab_alias
    question: "What quarterly report must a bank now file with the AML Reporting Desk under the 2026 KYC changes, and by which day after the quarter closes is it due?"
    hops: 1
    bridge_entities: []
    gold_facts:
      - fact: "From the quarter ending September 30, 2026, an Aggregated Small-Value Alert Report must be furnished to FIU-IND through FINnet by the 21st day of the month following the close of the quarter."
        anchors: ["Aggregated Small-Value Alert Report", "21st day of the month"]
        evidence: "grc_rbi_kyc_amend_2026:c9"
    gold_entities: ["FIU-IND", "Paragraph 52G", "Aggregated Small-Value Alert Report", "ASVAR filing deadline", "KYC Amendment Directions 2026"]
    must_include: ["21st"]
    must_not: ["15th"]
  - id: grc_a2
    category: vocab_alias
    question: "By what factor does the Central Regulator scale up a penalty when the same kind of lapse is repeated, and within what period must the repeat fall for this to apply?"
    hops: 1
    bridge_entities: []
    gold_facts:
      - fact: "A lapse under the same Enforcement Head within 24 months of a penalty order under that head increases the penalty to 1.5 times the specified amount."
        anchors: ["1.5 times"]
        evidence: "grc_rbi_enf_circ_2026:c8"
    gold_entities: ["Reserve Bank of India", "Repeat lapse multiplier", "Enforcement Circular 2026"]
    must_include: ["1.5", "24 months"]
    must_not: ["doubles"]

