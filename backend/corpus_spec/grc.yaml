    category: vocab_paraphrase
    question: "Before a bank may block withdrawals from someone's savings because they have not refreshed their identity paperwork in time, how many heads-ups must it send beforehand, and how long after the deadline must it wait?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "The regulated entity must send three advance intimations before the due date (at least one by letter) and three reminders after it, and may not impose partial freezing earlier than 105 days after the due date of updation."
        anchors: ["three advance intimations", "105 days"]
        evidence: "grc_rbi_kyc_amend_2026:c5"
    gold_entities: ["Paragraph 38D", "KYC Amendment Directions 2026"]
