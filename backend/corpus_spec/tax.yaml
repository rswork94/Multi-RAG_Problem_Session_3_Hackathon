documents:
  # ------------------------------------------------------------------ CBDT notification (first hop of m1)
  - id: tax_cbdt_n41_2026
    title: "Notification No. 41/2026: Income-tax (Seventeenth Amendment) Rules, 2026"
    doc_type: Notification
    format: pdf
    issued_date: 2026-08-12
    issuer: CBDT
    filler: 6
    clauses:
      - id: c1
        heading: "1. Short title, commencement and prospective application"
        text: >
          Notification No. 41/2026, G.S.R. 588(E).— In exercise of the powers conferred by the Income-tax Act, 2025,
          the Central Board of Direct Taxes hereby makes the following rules further to amend the Income-tax Rules,
          2026, namely:—
          (1) These rules may be called the Income-tax (Seventeenth Amendment) Rules, 2026. (2) They shall come
          into force with effect from the 1st day of October, 2026. (3) The amendments made by these rules are
          prospective. They shall apply only to sums credited or paid on or after the date of their commencement,
          and nothing in these rules shall require any deductor to revise a statement already furnished, or to
          reopen a deduction already made, in respect of any sum credited or paid before that date.
      - id: c2
        heading: "2. Amendment of rule 31AG"
        text: >
          In the Income-tax Rules, 2026 (hereinafter referred to as the said rules), in rule 31AG, in sub-rule (1),—
          (a) for the words "fees for technical services exceeding thirty thousand rupees in the aggregate during a
          quarter", the words "fees for technical services, including fees for remotely delivered engineering
          support, exceeding forty-seven thousand five hundred rupees in the aggregate during a quarter" shall be
          substituted; (b) after the words "paid to a resident", the words "whether or not the payee is registered
          on any electronic platform" shall be inserted. The limit of thirty thousand rupees, as it stood before
          this amendment, shall continue to govern every sum credited or paid before the commencement of these
          rules, and shall be treated as superseded only in respect of sums credited or paid thereafter.
      - id: c3
        heading: "3. Insertion of Explanation in rule 31AG"
        text: >
          In rule 31AG of the said rules, after sub-rule (3), the following Explanation shall be inserted,
          namely:— "Explanation.— For the purposes of this rule, the expression 'remotely delivered engineering
          support' means any design review, troubleshooting, commissioning guidance or similar technical assistance
          furnished by a person who is not physically present at the site where the plant, machinery or system
          concerned is located, irrespective of whether the assistance is furnished through a video conference, a
          software interface or any other electronic means." The Explanation is inserted with effect from the date
          of commencement of these rules. It is not clarificatory in nature and shall not be relied upon to
          determine the treatment of any payment made before that date.
      - id: c4
        heading: "4. Transitional arrangement for the quarter of commencement"
        text: >
          Where a deductor has, during the quarter in which these rules come into force, credited or paid fees for
          technical services both before and after their commencement, the deductor shall apply the earlier limit
          to the sums credited or paid before commencement and the revised limit to the sums credited or paid
          thereafter, and the two sets of sums shall not be aggregated for the purpose of determining whether
          either limit is exceeded. The quarterly statement for that quarter shall report the two sets of sums in
          separate parts. No deductor shall be treated as a deductor in default merely because tax was deducted,
          before commencement, on fees that would fall below the revised limit.
      - id: c5
        heading: "Explanatory Memorandum"
        text: >
          The amendments made by these rules have been given prospective effect only. It is certified that no
          person is being adversely affected by these rules, since the revised limit and the inserted Explanation
          apply to sums credited or paid after their commencement and do not alter any liability that arose
          earlier. Representations seeking retrospective application of the revised limit to the quarter ending
          on 30th September, 2026 have been considered and not accepted, because a retrospective change would
          require large numbers of correction statements without any corresponding benefit to deductors or to the
          revenue. [F. No. 370142/27/2026-TPL]

  # ------------------------------------------------------------------ Rules extract (bridge: rule -> form)
  - id: tax_it_rules_extract
    title: "Income-tax Rules, 2026: Extract of rules on quarterly statements and rates for specified service fees"
    doc_type: Rules
    format: docx
    issued_date: 2026-07-01
    issuer: CBDT
    filler: 6
    clauses:
      - id: c1
        heading: "Note on this extract"
        text: >
          This extract reproduces rules 31AE, 31AF, 31AG, 31AH and 37BF of the Income-tax Rules, 2026 as they
          stood on the 1st day of July, 2026. Amendments notified by the Central Board of Direct Taxes after that
          date are not incorporated in the text below and must be read alongside it. Users should therefore
          confirm, before relying on any monetary limit reproduced here, whether a later notification has
          substituted the words concerned. The rules prescribe the form of each quarterly statement but do not
          themselves fix the time within which the statement is to be furnished; that time is specified by the
          Board by circular, and the rates of deduction are specified in the Schedule of TDS Service Codes
          referred to in rule 37BF.
      - id: c2
        heading: "Rule 31AG. Quarterly statement of tax deducted on specified technical fees"
        text: >
          (1) Every person, other than an office of the Government, responsible for paying to a resident any sum
          by way of fees for technical services exceeding thirty thousand rupees in the aggregate during a quarter
          shall, after deducting tax thereon, prepare a quarterly statement of such deduction for that quarter.
          (2) The statement referred to in sub-rule (1) shall be furnished in Form 26QF to the Director General of
          Income-tax (Systems), or to the person authorised by him, and shall show against each payment the
          service code under which it is classified. (3) A deductor who has furnished a statement under sub-rule
          (2) may furnish a correction statement for the same quarter in the same form, and the correction
          statement shall replace the earlier statement to the extent of the correction.
      - id: c3
        heading: "Rule 31AH. Quarterly statement of tax deducted on platform-mediated professional fees"
        text: >
          (1) Every operator of an electronic platform through which a resident professional is engaged by a
          client, and who is responsible for crediting fees for professional services to the account of such
          professional, shall prepare a quarterly statement of the tax deducted on such fees. (2) The statement
          referred to in sub-rule (1) shall be furnished in Form 26QH and shall report separately the fees
          credited under each service code. (3) Where the client has itself deducted tax on the same fees, the
          operator shall report the transaction in Part C of the statement, together with the particulars of the
          deduction made by the client, and shall not deduct tax again on that transaction. (4) An operator that
          has credited no such fees during a quarter shall furnish a nil statement for that quarter.
      - id: c4
        heading: "Rule 31AF. Quarterly statement of tax deducted on technical fees paid to non-residents"
        text: >
          (1) Every person responsible for paying to a non-resident, not being a company, or to a foreign company,
          any sum by way of fees for technical services chargeable to tax under the Act shall prepare a quarterly
          statement of the tax deducted thereon. (2) The statement shall be furnished in Form 27QF and shall
          contain the particulars of the tax residency certificate, if any, relied upon by the deductor for
          applying a rate under an agreement for the avoidance of double taxation. (3) Nothing in this rule shall
          apply to a payment that is required to be reported in a statement under rule 31AG or rule 31AH.
      - id: c5
        heading: "Rule 31AE. Quarterly statement of technical fees paid by government deductors"
        text: >
          (1) Every office of the Government responsible for paying to a resident any sum by way of fees for
          technical services shall prepare a quarterly statement of the tax deducted thereon, irrespective of the
          amount of such fees. (2) The statement referred to in sub-rule (1) shall be furnished in Form 26QG by the
          drawing and disbursing officer of that office. (3) The pay and accounts officer, treasury officer or
          cheque drawing and disbursing officer, as the case may be, shall furnish to the Director General of
          Income-tax (Systems) a consolidated summary of the statements furnished by all offices under his
          control, in such format as may be specified.
      - id: c6
        heading: "Rule 37BF. Rate of deduction for notified service codes"
        text: >
          (1) Tax on fees reported under rules 31AE, 31AF, 31AG and 31AH shall be deducted at the rate specified
          against the relevant service code in the Schedule of TDS Service Codes published by the Board under this
          rule. (2) The Board may, by order, revise the rate against any service code with effect from the first
          day of a quarter, and every revision shall be published in the Schedule together with the date from
          which the revised rate applies. (3) Where a rate has been revised, the earlier rate shall be shown in the
          Schedule as superseded and shall continue to apply to sums credited or paid before the date of
          revision. (4) The classification of a payment under a service code shall follow the description in the
          Schedule, read with any circular issued by the Board.

  # ------------------------------------------------------------------ CBDT due-date circular (final hop of m1, m4)
  - id: tax_cbdt_c14_2026
    title: "Circular No. 14/2026: Due dates for furnishing quarterly statements of tax deducted on specified service fees"
    doc_type: Circular
    format: pdf
    issued_date: 2026-09-24
    issuer: CBDT
    filler: 8
    clauses:
      - id: c1
        heading: "1. Background"
        text: >
          The Income-tax Rules, 2026 introduced four quarterly statements of tax deducted at source on specified
          service fees, to be furnished in Forms 26QF, 26QG, 26QH and 27QF respectively. The rules leave the time
          for furnishing each statement to be specified by the Central Board of Direct Taxes. Circular No. 5/2026
          specified provisional due dates pending the stabilisation of the reporting utility. Having considered
          representations from deductors, software vendors and professional bodies, the Board, by this Circular
          No. 14/2026, hereby specifies
          the due dates set out in paragraphs 2 to 5 below, which shall apply in place of the provisional dates.
          Each paragraph deals with one statement only, and the due date in one paragraph shall not be applied to
          a statement dealt with in another.
      - id: c2
        heading: "2. Due date for the statement in Form 26QF"
        text: >
          The quarterly statement in Form 26QF shall be furnished on or before the 19th day following the end of
          the quarter to which it relates, in respect of each of the quarters ending on 30th June, 30th September
          and 31st December. For the quarter ending on 31st March, the statement shall be furnished on or before
          the 9th day of June following the end of that quarter, so that deductors can reconcile year-end credits
          before issuing certificates to payees. Where the due date falls on a public holiday, the statement may
          be furnished on the next working day without any fee for late furnishing.
      - id: c3
        heading: "3. Due date for the statement in Form 26QG"
        text: >
          The quarterly statement in Form 26QG shall be furnished by the drawing and disbursing officer on or
          before the 24th day following the end of the quarter to which it relates, for every quarter including
          the quarter ending on 31st March. The pay and accounts officer shall furnish the consolidated summary of
          the statements of the offices under his control within seven days after that date. Since government
          deductors remit tax by book entry, the statement shall carry the book identification number generated
          for each remittance, and a statement without that number shall be treated as defective.
      - id: c4
        heading: "4. Due date for the statement in Form 26QH"
        text: >
          The quarterly statement in Form 26QH shall be furnished on or before the 22nd day following the end of
          the quarter to which it relates. For the quarter ending on 31st March, the same due date shall apply and
          no separate year-end window is provided, because deductions reported in this statement are reconciled
          with the corresponding deductions of other persons as transactions occur. A deductor that has nothing to
          report for a quarter shall nonetheless furnish a nil statement within the same time, so that the
          absence of deductions can be verified against the payment data available to the reporting utility.
      - id: c5
        heading: "5. Due date for the statement in Form 27QF"
        text: >
          The quarterly statement in Form 27QF shall be furnished on or before the 15th day of the second month
          following the quarter to which it relates. The longer period recognises that deductors paying
          non-residents frequently await tax residency certificates and treaty documentation from the payee. A
          deductor that furnishes the statement without the residency particulars shall furnish a correction
          statement once those particulars are received, and the correction shall not by itself attract any fee
          for late furnishing, provided the original statement was furnished within the due date.
      - id: c6
        heading: "6. Withdrawal of Circular No. 5/2026"
        text: >
          Circular No. 5/2026, which had provisionally specified the 31st day following the end of the quarter as
          the due date for the statements in Forms 26QF and 26QH, and the 30th day of June for the quarter ending
          on 31st March, is hereby withdrawn. The dates in that circular are superseded and shall not be relied
          upon for any quarter ending on or after 30th September, 2026. Statements for the quarter ending on 30th
          June, 2026 that were furnished within the dates in that circular shall be treated as furnished in time,
          and no fee shall be levied in respect of them.
      - id: c7
        heading: "7. Prospective application"
        text: >
          The due dates in paragraphs 2 to 5 are prospective. They apply to statements for the quarter ending on
          30th September, 2026 and every subsequent quarter. They do not reopen or alter the time allowed for any
          statement relating to an earlier quarter, and no fee or penalty already levied for an earlier quarter
          shall be revised by reason of this circular. This circular does not change the form or contents of any
          statement, which continue to be governed by the rules under which each statement is prescribed.
      - id: c8
        heading: "8. Fee for late furnishing and processing"
        text: >
          The fee for default in furnishing a statement shall be computed under the Act from the day following
          the due date specified in this circular for that statement. A statement furnished after its due date
          shall be accepted by the reporting utility only if the fee is paid before the statement is uploaded.
          Field authorities are requested to bring this circular to the notice of all deductors, and the
          Director General of Income-tax (Systems) shall update the validation logic of the reporting utility to
          reflect the dates specified above.

  # ------------------------------------------------------------------ CBDT retrospective clarification (first hop of m2)
  - id: tax_cbdt_c9_2026
    title: "Circular No. 9/2026: Clarification on deduction of tax from fees for remote plant-monitoring services"
    doc_type: Circular
    format: pdf
    issued_date: 2026-06-17
    issuer: CBDT
    filler: 6
    clauses:
      - id: c1
        heading: "1. Issue raised"
        text: >
          Representations have been received by the Central Board of Direct Taxes seeking clarity on the
          treatment of fees paid to resident service providers for remote plant-monitoring, that is, the
          continuous observation of the operating data of a client's machinery through sensors and software,
          coupled with alerts and predictive-maintenance recommendations issued without any visit to the client's
          premises. Deductors have taken divergent positions, some treating the fees as charges for a software
          subscription on which no tax is deductible, some as professional fees, and others as fees for technical
          services. The divergence has led to mismatches between deductors' statements and payees' returns.
      - id: c2
        heading: "2. Clarification"
        text: >
          The Central Board of Direct Taxes, having examined the matter, hereby clarifies by this Circular
          No. 9/2026 that fees for remote
          plant-monitoring and the accompanying predictive-maintenance recommendations are in the nature of fees
          for technical services, since the payer obtains the benefit of the technical knowledge and judgment of
          the service provider and not merely access to software. Such fees are classifiable under service code
          TS-07 of the Schedule of TDS Service Codes. This clarification is retrospective in nature. It does not
          introduce a new levy but explains the law as it has always stood, and it shall accordingly apply since
          the inception of the Schedule, that is, from the 1st day of April, 2026.
      - id: c3
        heading: "3. Consequences for deductors in respect of past periods"
        text: >
          Since the clarification applies since inception, deductors who did not deduct tax on such fees for any
          earlier part of the year should regularise the position. A deductor shall not be treated as a deductor
          in default, and no interest shall be charged, if the shortfall is deducted from subsequent payments to
          the same payee and is reported in a correction statement furnished within one hundred and twenty days
          of the date of this circular. Payees who have already offered the fees to tax shall be allowed credit
          for the tax so deducted in the year in which the fees were offered.
      - id: c4
        heading: "4. Scope of the clarification"
        text: >
          This clarification does not apply to a payment made solely for the right to use a software product
          where no monitoring, analysis or recommendation is furnished by the service provider. Nor does it
          decide the classification of on-site commissioning or repair services, which continue to be governed by
          the descriptions in the Schedule. Where a single invoice covers both a licence and monitoring services,
          the deductor shall apportion the consideration on a reasonable basis, supported by the contract, and
          shall apply service code TS-07 only to the monitoring component.
      - id: c5
        heading: "5. Reporting of deductions"
        text: >
          Tax deducted on such fees shall be reported in the quarterly statement applicable to fees for technical
          services paid to residents, showing the service code against each payment. Deductors whose accounting
          systems record such payments under a general software or subscription ledger shall create a separate
          ledger tag so that the service code is populated correctly. The Board will monitor the mismatches
          referred to in paragraph 1 and may issue further instructions if the divergence persists after the
          statements for the current year have been processed.
      - id: c6
        heading: "6. Illustration"
        text: >
          Illustration.— A resident manufacturer of cement engages a resident analytics firm to observe the
          vibration and temperature data of its kilns from the firm's own control room and to send weekly
          maintenance advisories. The firm never visits the plant. The monthly fee is a fee for technical services
          classified under the code mentioned in paragraph 2, and tax is deductible on each credit of the fee to
          the firm's account. If the same firm also grants a perpetual licence for its dashboard software for a
          separate one-time consideration, that consideration is outside this clarification, unless the licence
          fee is in substance a payment for continuing monitoring.

