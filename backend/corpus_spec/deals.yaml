questions:
  # ---------------------------------------------------------------- keyword
  - id: deals_k1
    category: keyword
    question: "Under Clause 9.4(c) of the Kestrel SPA, what is the de minimis amount below which an individual warranty claim against the Seller is disregarded?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "Individual Warranty Claims, or related series of claims, with Losses below ₹42.50 lakh are disregarded under the de minimis in Clause 9.4(c)."
        anchors: ["₹42.50 lakh"]
        evidence: "deals_spa_kestrel:c11"
    gold_entities: ["Kestrel SPA", "De Minimis Threshold", "Halden Holdings LLP"]
    must_include: ["42.50 lakh"]
    must_not: []

  - id: deals_k2
    category: keyword
    question: "What is the Escrow Amount withheld at Completion under Clause 4.2 of the Kestrel SPA, and on which dates is it released to the Seller?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "The Escrow Amount is ₹55.56 crore held with Varenya Bank Limited; ₹27.78 crore is released on 14 April 2027 and the balance with interest on 29 September 2027, less amounts retained for notified claims."
        anchors: ["₹55.56 crore", "14 April 2027", "29 September 2027"]
        evidence: "deals_spa_kestrel:c6"
    gold_entities: ["Kestrel SPA", "Escrow Amount", "Varenya Bank Limited", "Halden Holdings LLP"]
    must_include: ["55.56 crore", "14 April 2027", "29 September 2027"]
    must_not: []

  - id: deals_k3
    category: keyword
    question: "By what date must Form FC-TRS be filed for the transfer of the Kestrel Sale Shares, and who must file it?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "Form FC-TRS must be filed on the FIRMS portal within sixty days, that is on or before 29 December 2026, by the resident transferor Halden Holdings LLP through its AD Category-I bank Varenya Bank Limited."
        anchors: ["29 December 2026"]
        evidence: "deals_fema_pricing_memo:c6"
    gold_entities: ["Form FC-TRS", "FC-TRS Due Date", "Halden Holdings LLP", "Varenya Bank Limited", "Reserve Bank of India"]
    must_include: ["29 December 2026"]
    must_not: []

  - id: deals_k4
    category: keyword
    question: "According to the signing exposure schedule, what collar applies to the net working capital adjustment, and which SPA clause does it sit under?"
    hops: 0
    bridge_entities: []
    gold_facts:
      - fact: "The signing exposure schedule records a net working capital collar of 15750000 rupees under Clause 3.3, against a target working capital of 1186000000 rupees."
        anchors: ["15750000", "Clause 3.3"]
        evidence: "deals_exposure_schedule:row6"
    gold_entities: ["Signing Exposure Schedule", "Net Working Capital Collar", "Kestrel SPA"]
    must_include: ["Clause 3.3"]
    must_not: []

  # ---------------------------------------------------------------- multihop
  - id: deals_m1
    category: multihop
    question: "What cap now limits the Seller's liability for the matter set out at Disclosure Item 7 of the Kestrel Disclosure Letter?"
    hops: 3
    bridge_entities: ["Paragraph 6.4 of Schedule 3", "Specific Tax Indemnity", "Original Specific Tax Indemnity Cap", "Amendment Agreement No. 1"]
    gold_facts:
      - fact: "Disclosure Item 7 discloses the assessment year 2023-24 transfer pricing draft order (tax and interest of ₹27.64 crore) and the related 2024-25 reference against Paragraph 6.4 of Schedule 3."
        anchors: ["₹27.64 crore"]
        evidence: "deals_disclosure_letter:c4"
      - fact: "Clause 10.2 of the SPA makes matters disclosed against Paragraph 6.4 of Schedule 3 Specified Tax Matters, indemnified notwithstanding disclosure and outside the General Cap, de minimis and Aggregate Claims Threshold, subject to the cap in Clause 10.2(b)."
        anchors: ["Specified Tax Matters"]
        evidence: "deals_spa_kestrel:c13"
      - fact: "Amendment Agreement No. 1 replaced Clause 10.2(b), so the Specific Tax Indemnity Cap is now ₹36.75 crore for all claims, replacing the figure originally agreed."
        anchors: ["₹36.75 crore"]
        evidence: "deals_amendment_no1:c2"
    gold_entities: ["Disclosure Item 7", "Kestrel Disclosure Letter", "Paragraph 6.4 of Schedule 3", "Specific Tax Indemnity", "Revised Specific Tax Indemnity Cap", "Amendment Agreement No. 1", "Halden Holdings LLP"]
    must_include: ["36.75 crore"]
    must_not: ["31.25 crore"]

  - id: deals_m2
    category: multihop
    question: "What per-share value did the Section 247 registered valuer conclude for Kestrel, and what does that value imply for the least the purchaser may pay in total for the shares being sold and the cushion left by the agreed deal value?"
    hops: 2
    bridge_entities: ["Kestrel Fair Value per Share", "FEMA Pricing Floor"]
    gold_facts:
      - fact: "The Section 247 registered valuer concluded a fair value of ₹1,268.40 per equity share as at 31 March 2026, weighting the DCF and comparable companies values 60:40."
        anchors: ["₹1,268.40"]
        evidence: "deals_valuation_report:c5"
      - fact: "Applying that value as the FEMA Floor to the 51,72,000 Sale Shares gives a minimum aggregate consideration of ₹656.02 crore, which the ₹694.47 crore Purchase Consideration exceeds by ₹38.45 crore."
        anchors: ["₹656.02 crore", "₹38.45 crore"]
        evidence: "deals_fema_pricing_memo:c4"
    gold_entities: ["Kestrel Valuation Report", "Section 247 of the Companies Act, 2013", "Kestrel Fair Value per Share", "FEMA Pricing Floor", "Minimum Aggregate Consideration", "Purchase Consideration"]
    must_include: ["1,268.40", "656.02"]
    must_not: ["677.53"]

  - id: deals_m3
    category: multihop
    question: "Until what date can the buyer rely on a Material Adverse Change at Kestrel to walk away from the deal, and what procedure must it follow to do so?"
    hops: 3
    bridge_entities: ["MAC Termination Right", "Long Stop Date", "Amendment Agreement No. 1"]
    gold_facts:
      - fact: "A Material Adverse Change includes a 22.5 per cent decline in consolidated EBITDA over two consecutive quarters, loss of a Key Customer with 18 per cent or more of revenue, or an uninsured loss above ₹48.30 crore."
        anchors: ["22.5 per cent decline in consolidated EBITDA"]
        evidence: "deals_spa_kestrel:c3"
      - fact: "Under Clause 14.1(b) the Purchaser may terminate by written notice before Completion, served within fifteen Business Days of becoming aware of the MAC and in any event on or before the Long Stop Date, with an auditor-reviewed EBITDA computation if limb (a) is relied on."
        anchors: ["fifteen Business Days"]
        evidence: "deals_spa_kestrel:c17"
      - fact: "Amendment Agreement No. 1 extended the Long Stop Date from 30 September 2026 to 16 November 2026."
        anchors: ["16 November 2026"]
        evidence: "deals_amendment_no1:c3"
    gold_entities: ["Material Adverse Change", "MAC Termination Right", "Long Stop Date", "Amendment Agreement No. 1", "Kestrel SPA", "Orion Capital Partners (Mauritius) Ltd"]
    must_include: ["16 November 2026"]
    must_not: ["30 September 2026"]

  - id: deals_m4
    category: multihop
    question: "How was Red Flag RF-2 from the due diligence findings memo on Kestrel finally dealt with in the signed transaction documents?"
    hops: 2
    bridge_entities: ["Chakan Consent to Operate", "Chakan CTO Condition"]
    gold_facts:
      - fact: "RF-2 found that the MPCB consent to operate for the Chakan Facility expired on 17 January 2026 with renewal pending, and recommended making renewal a condition precedent to Completion."
        anchors: ["17 January 2026"]
        evidence: "deals_dd_findings_memo:c3"
      - fact: "Amendment Agreement No. 1 deleted the consent condition in Clause 7.1(e); the Seller must procure the renewal by 26 February 2027, and ₹6.45 crore of the Escrow Amount is held as the CTO Retention, from which the Purchaser may recover Losses if the renewal is not obtained."
        anchors: ["26 February 2027", "₹6.45 crore"]
        evidence: "deals_amendment_no1:c4"
    gold_entities: ["Red Flag RF-2", "DD Findings Memo", "Chakan Consent to Operate", "Chakan CTO Condition", "Amendment Agreement No. 1", "CTO Retention", "Chakan CTO Renewal Deadline", "Maharashtra Pollution Control Board"]
    must_include: ["26 February 2027", "6.45 crore"]
    must_not: []

