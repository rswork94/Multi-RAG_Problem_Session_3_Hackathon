    financial year must it obtain reasonable assurance on its BRSR Core, and what
    eligibility criteria must its assurance provider meet?
  hops: 2
  bridge_entities:
  - Cohort-2 entities
  - Category S2 assurance provider
  gold_facts:
  - fact: Listed entities ranked 251 to 500 by market capitalisation (Cohort-2) must
      obtain reasonable assurance on BRSR Core from FY 2027-28, with the cohort fixed
      by market capitalisation as on March 31 of the preceding year.
    anchors:
    - ranked 251 to 500
