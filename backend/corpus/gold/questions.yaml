  - fact: 'A Cohort-2 entity must appoint a Category S2 (or S1) provider: valid peer
      review certificate or accreditation, at least three BRSR Core assurance engagements
      in the preceding two years, enrolment in Register Part B, a greenhouse gas specialist
      from an ISO 14065 accredited body, and an engagement partner with at least five
      years'' experience.'
    anchors:
    - Register Part B
    - ISO 14065
    evidence: grc_sebi_assurer_2026:c3
    source: grc_sebi_assurer_2026.pdf
